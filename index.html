let user=null,state={strikes:0,permanent:false},busy=false;
const esc2=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function show(html,bg){gate.style.background=bg||"";gate.innerHTML=html;gate.hidden=false}
function signInScreen(msg){
  show(`<div class="gin">${typeof FLAG==="string"?FLAG:""}<h1>New Comland Browser</h1><p>${esc2(msg||"Sign in with your Google account to use the browser.")}</p><button id="gsi">Sign in with Google</button></div>`);
  document.getElementById("gsi").onclick=async()=>{try{await Au.signInWithPopup(auth,new Au.GoogleAuthProvider())}catch(e){signInScreen("Sign-in didn’t finish. Allow pop-ups for this page and try again.")}};
}
function banScreen(img,txt){
  show(`<div class="bn"><img src="${img}" alt="You are banned"><p>${esc2(txt)}</p><button id="gso">Sign out</button></div>`,"#d9141a");
  document.getElementById("gso").onclick=()=>Au.signOut(auth);
}
function enforce(){
  if(state.permanent){banScreen(BANP,"This Google account is permanently banned.");return true}
  if(state.strikes>=1&&state.bannedAt){
    const end=state.bannedAt.toMillis()+7*DAY;
    if(Date.now()<end){banScreen(BAN7,"Your ban ends on "+new Date(end).toLocaleString()+".");return true}
  }
  gate.hidden=true;gate.innerHTML="";return false;
}
Au.onAuthStateChanged(auth,async u=>{
  user=u;
  if(!u){state={strikes:0,permanent:false};signInScreen();return}
  try{
    const snap=await Fs.getDoc(Fs.doc(db,"bans",u.uid));
    state=snap.exists()?snap.data():{strikes:0,permanent:false};
    enforce();
  }catch(e){console.error(e);signInScreen("Couldn’t check your account. Check your connection and try again.")}
});
window.comlandReport=async()=>{
  if(!user||busy) return;
  busy=true;
  try{
    const ref=Fs.doc(db,"bans",user.uid);
    if(state.strikes>=1){
      await Fs.updateDoc(ref,{strikes:2,permanent:true});
      state={...state,strikes:2,permanent:true};
    }else{
      await Fs.setDoc(ref,{email:user.email||"",strikes:1,permanent:false,bannedAt:Fs.serverTimestamp()});
      state={strikes:1,permanent:false,bannedAt:{toMillis:()=>Date.now()}};
    }
    enforce();
  }catch(e){console.error(e)}
  busy=false;
};
