<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Comland Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#000;--mute:#5a5a5a;--line:#d9d9d9;--panel:#f4f4f4;--red:#f00;--teal:#14f5b8;--pink:#ff0a54;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111;--ink:#f5f5f5;--mute:#a5a5a5;--line:#333;--panel:#1c1c1c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111;--ink:#f5f5f5;--mute:#a5a5a5;--line:#333;--panel:#1c1c1c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:1px}
/* stripe motif: the flag's black bars frame the window */
.tabs{display:flex;align-items:flex-end;gap:2px;padding:6px 10px 0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;min-height:42px}
.tab{display:flex;align-items:center;gap:8px;max-width:200px;min-width:90px;padding:7px 10px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--panel);color:var(--mute);font-size:13px;white-space:nowrap}
.tab span{overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.tab.on{background:var(--bg);color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.tab .x{border:0;background:none;padding:0 2px;line-height:1;opacity:.6}
.tab .x:hover{opacity:1;color:var(--red)}
.plus{border:0;background:none;font-size:20px;padding:4px 10px}
.bar{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.ib{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--bg);font-size:16px;flex:none}
.ib:hover:not(:disabled){background:var(--ink);color:var(--bg)}
.ib:disabled{opacity:.35;cursor:default}
.addr{flex:1;display:flex;align-items:center;border:2px solid var(--ink);border-radius:20px;padding:0 12px;height:36px;min-width:0;position:relative}
.addr:focus-within{border-color:transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(135deg,var(--teal),var(--pink)) border-box;border:2px solid transparent}
.addr input{flex:1;border:0;background:none;color:inherit;font:inherit;font-size:14px;outline:0;min-width:0}
.dot{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--pink));margin-right:8px;flex:none}
.marks{display:flex;gap:6px;padding:5px 10px;border-bottom:1px solid var(--line);overflow-x:auto;font-size:13px;min-height:34px;align-items:center}
.marks button{border:0;background:var(--panel);border-radius:14px;padding:4px 12px;white-space:nowrap}
.marks button:hover{background:var(--ink);color:var(--bg)}
.marks em{color:var(--mute);font-style:normal}
main{flex:1;position:relative;min-height:0;background:var(--bg)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.note{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:13px;z-index:2}
.note a,.note button{color:var(--ink);font-weight:600}
.note button{border:0;background:none;text-decoration:underline}
.page{position:absolute;inset:0;overflow:auto;padding:24px 20px 60px}
.wrap{max-width:760px;margin:0 auto}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:2vh}
.hero svg{width:min(560px,92%);height:auto;border:1px solid var(--line)}
h1{font-size:clamp(30px,6vw,52px);font-weight:800;margin:6px 0 0;letter-spacing:-.02em;line-height:1}
.hero p{margin:0;color:var(--mute);max-width:46ch}
.search{display:flex;width:min(560px,100%);border:2px solid var(--ink);border-radius:28px;overflow:hidden}
.search input{flex:1;border:0;padding:12px 18px;font:inherit;background:none;color:inherit;outline:0;min-width:0}
.search button{border:0;background:var(--ink);color:var(--bg);padding:0 22px;font-weight:600}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:min(760px,100%);margin-top:8px}
.quick button{border:1px solid var(--line);background:var(--bg);padding:14px 10px;border-radius:10px;font-weight:600;display:flex;flex-direction:column;gap:2px;align-items:center}
.quick button small{font-weight:400;color:var(--mute)}
.quick button:hover{border-color:var(--ink)}
h2{font-size:26px;margin:0 0 12px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.row button.go{border:0;background:none;text-align:left;flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--mute);font-weight:400}
.row .rm{border:0;background:none;color:var(--red)}
.pill{border:1px solid var(--ink);background:var(--bg);border-radius:18px;padding:7px 16px;font-weight:600}
.pill:hover{background:var(--ink);color:var(--bg)}
.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.card p{margin:6px 0 0;color:var(--mute);line-height:1.5}
.blocked{background:#fff;color:#000;display:flex;align-items:center;justify-content:center}
.bwrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;max-width:640px}
.bwrap h1{font-size:clamp(34px,7vw,60px);margin:0}
.bwrap h2{font-size:clamp(18px,3.4vw,28px);margin:0;font-weight:800;line-height:1.2}
.bwrap svg{width:min(380px,80%);height:auto}
.modes{display:flex;gap:6px;margin-bottom:16px}
.modes button{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:7px 18px;font-weight:600}
.modes button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.muted{color:var(--mute);font-size:13px}
.info{line-height:1.6;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.grid figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.grid img{width:100%;display:block;aspect-ratio:1}
.grid figcaption{padding:8px 10px;font-size:13px;color:#000;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.hero svg{animation:in .6s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>

  let s=null;try{s=window.claude?await window.claude.use("sample"):null}catch(e){}
  if(!s) return webSearch(res,t,q,fail);
  if(await unsafe(s,"search request",q)){p.replaceWith(blockedPage("This topic is Blocked by the Colandian Government"));return}
  try{
    if(t==="info"){
      const r=await s("Write an encyclopedia-style summary for the search query below. 2 to 4 short paragraphs, plain text only, no markdown, no preamble. If the query is ambiguous, briefly cover the main meanings.\nQuery: "+q,{modelTier:"quick",onText:x=>showInfo(res,x.text)});
      showInfo(res,r.text);
    }else if(t==="sites"){
      const arr=await s.json("Return ONLY a JSON array of 6 objects with keys title, url, desc (one short sentence). They are the best well-known websites for the search query below. Use only real https URLs of official or established sites; if unsure of an exact page, use the site’s root domain.\nQuery: "+q,{modelTier:"quick"});
      const list=(Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.url==="string"&&/^https:\/\//.test(x.url)&&!isBlocked(x.url));
      res.innerHTML="";
      if(!list.length) return fail("No websites found. Try different words.");
      const box=document.createElement("div");box.className="list";
      list.forEach(x=>{const r=document.createElement("div");r.className="row";const b=document.createElement("button");b.className="go";b.textContent=x.title||x.url;const sm=document.createElement("small");sm.textContent=x.url+" — "+(x.desc||"");b.appendChild(sm);b.onclick=()=>go(x.url);r.appendChild(b);box.appendChild(r)});
      res.appendChild(box);
      const n=document.createElement("p");n.className="muted";n.textContent="Suggested by Claude. Links aren’t checked, and some sites can’t load inside a browser page.";res.appendChild(n);
    }else{
      const arr=await s.json("Return ONLY a JSON array of 6 objects with keys caption and svg. Each svg is a simple, flat, colorful illustration related to the search query below, as a complete standalone SVG string starting with <svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\">, no text elements, no scripts, under 700 characters.\nQuery: "+q,{modelTier:"default"});
      const list=(Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x.svg==="string"&&x.svg.trim().startsWith("<svg")&&x.svg.length<5000);
      res.innerHTML="";
      if(!list.length) return fail("No images made. Try different words.");
      const g=document.createElement("div");g.className="grid";
      list.forEach(x=>{const f=document.createElement("figure");const i=document.createElement("img");i.alt=x.caption||q;i.src="data:image/svg+xml;utf8,"+encodeURIComponent(x.svg);const c=document.createElement("figcaption");c.textContent=x.caption||"";f.appendChild(i);f.appendChild(c);g.appendChild(f)});
      res.appendChild(g);
      const n=document.createElement("p");n.className="muted";n.textContent="These are illustrations drawn by Claude, not photos from the web.";res.appendChild(n);
    }
  }catch(e){
    if(e&&e.code==="not_granted") return webSearch(res,t,q,fail);
    fail(e&&e.code==="rate_limited"?"Too many searches. Wait a moment and try again.":"Search failed. Try again.");
  }
}
/* Search used outside Claude: Wikipedia + Wikimedia Commons public APIs (CORS enabled) */
const WIKI="https://en.wikipedia.org/w/api.php?format=json&origin=*&";
const COMMONS="https://commons.wikimedia.org/w/api.php?format=json&origin=*&";
const plain=h=>{const d=new DOMParser().parseFromString(String(h),"text/html");return d.body.textContent||""};
const okText=x=>!blockedSearch("comland://search?q="+encodeURIComponent(x));
async function jget(url){const r=await fetch(url);if(!r.ok)throw new Error("http");return r.json()}
function engineLinks(res,q){
  const links=[["DuckDuckGo","https://duckduckgo.com/?q="],["Bing","https://www.bing.com/search?q="],["Internet Archive","https://archive.org/search?query="]];
  const h=document.createElement("h2");h.textContent="Search the wider web";h.style.fontSize="18px";h.style.marginTop="22px";res.appendChild(h);
  const box=document.createElement("div");box.className="list";
  links.forEach(l=>{const r=document.createElement("div");r.className="row";const sp=document.createElement("strong");sp.textContent=l[0];const a=document.createElement("a");a.className="pill";a.target="_blank";a.rel="noopener noreferrer";a.href=l[1]+encodeURIComponent(q);a.textContent="Open \u2197";r.appendChild(sp);r.appendChild(a);box.appendChild(r)});
  res.appendChild(box);
}
function note(res,txt){const n=document.createElement("p");n.className="muted";n.textContent=txt;res.appendChild(n)}
async function webSearch(res,t,q,fail){
  try{
    if(t==="info"){
      const d=await jget(WIKI+"action=query&generator=search&gsrlimit=3&gsrsearch="+encodeURIComponent(q)+"&prop=extracts&exintro=1&explaintext=1&exlimit=max");
      const pages=Object.values((d.query&&d.query.pages)||{}).sort((a,b)=>a.index-b.index).filter(p=>p.extract&&okText(p.title)&&okText(p.extract.slice(0,400)));
      res.innerHTML="";
      if(!pages.length){fail("No results found. Try different words.");engineLinks(res,q);return}
      pages.forEach((p,i)=>{
        const h=document.createElement("h2");h.textContent=p.title;h.style.fontSize=i?"18px":"22px";res.appendChild(h);
        p.extract.trim().split(/\n+/).slice(0,i?1:3).forEach(x=>{const e=document.createElement("p");e.className="info";e.textContent=x;res.appendChild(e)});
        const b=document.createElement("button");b.className="pill";b.textContent="Read the full article";b.onclick=()=>go("https://en.wikipedia.org/wiki/"+encodeURIComponent(p.title.replace(/ /g,"_")));res.appendChild(b);
      });
      note(res,"Summaries from Wikipedia.");engineLinks(res,q);
    }else if(t==="sites"){
      const d=await jget(WIKI+"action=query&list=search&srlimit=8&srsearch="+encodeURIComponent(q));
      const list=((d.query&&d.query.search)||[]).filter(x=>okText(x.title));
      res.innerHTML="";
      if(!list.length){fail("No websites found. Try different words.");engineLinks(res,q);return}
      const box=document.createElement("div");box.className="list";
      list.forEach(x=>{const r=document.createElement("div");r.className="row";const b=document.createElement("button");b.className="go";b.textContent=x.title;const sm=document.createElement("small");sm.textContent=plain(x.snippet)+"\u2026";b.appendChild(sm);b.onclick=()=>go("https://en.wikipedia.org/wiki/"+encodeURIComponent(x.title.replace(/ /g,"_")));r.appendChild(b);box.appendChild(r)});
      res.appendChild(box);note(res,"Pages found on Wikipedia.");engineLinks(res,q);
    }else{
      const d=await jget(COMMONS+"action=query&generator=search&gsrnamespace=6&gsrlimit=18&gsrsearch="+encodeURIComponent(q)+"&prop=imageinfo&iiprop=url&iiurlwidth=360");
      const list=Object.values((d.query&&d.query.pages)||{}).sort((a,b)=>a.index-b.index).filter(p=>p.imageinfo&&p.imageinfo[0]&&/\.(jpe?g|png|gif|svg|webp)$/i.test(p.title)&&okText(p.title));
      res.innerHTML="";
      if(!list.length){fail("No images found. Try different words.");engineLinks(res,q);return}
      const g=document.createElement("div");g.className="grid";
      list.forEach(p=>{const ii=p.imageinfo[0],f=document.createElement("figure"),i=document.createElement("img");const cap=p.title.replace(/^File:/,"").replace(/\.[a-z0-9]+$/i,"");i.alt=cap;i.loading="lazy";i.referrerPolicy="no-referrer";i.src=ii.thumburl||ii.url;i.style.objectFit="cover";const c=document.createElement("figcaption");c.textContent=cap;f.appendChild(i);f.appendChild(c);g.appendChild(f)});
      res.appendChild(g);note(res,"Images from Wikimedia Commons.");engineLinks(res,q);
    }
  }catch(e){fail("Search couldn\u2019t reach the web. Check your connection and try again.");engineLinks(res,q)}
}
function blockedSearch(u){
  const q=(new URLSearchParams(u.split("?").slice(1).join("?")).get("q")||"").toLowerCase(),qc=q.replace(/[^a-z0-9.]/g,"");
  return BLOCK_TERMS.some(w=>new RegExp("(^|[^a-z0-9])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(q))||BRAND_TERMS.some(w=>qc.includes(w))||BLOCKED.some(d=>qc.includes(d));
}
const SAFE=["youtube.com","youtube-nocookie.com","youtu.be","discord.com","discord.gg","roblox.com","wikipedia.org","wikimedia.org","archive.org","github.com","google.com","openstreetmap.org","twitch.tv","minecraft.net","mozilla.org","claude.ai","anthropic.com","widgetbot.io","daynighttimegh.github.io"];
const verdicts=new Map(),siteBad=new Map();
function hostOf(u){try{return new URL(u).hostname.toLowerCase().replace(/^www\./,"")}catch(e){return ""}}
function safeHost(u){const h=hostOf(u);return SAFE.some(d=>h===d||h.endsWith("."+d))}
async function unsafe(s,kind,text){
  const key=kind+"|"+text;
  if(verdicts.has(key)) return verdicts.get(key);
  let bad=false;
  try{
    const r=await s.json("You are the content filter for a family-friendly browser. Decide whether this "+kind+" is about any of: adult content, gambling, scams or phishing, malware or pirated software, hacking into accounts or devices, illegal drugs, weapons or making dangerous things, extreme gore, hate groups, or encouraging self-harm. Ordinary news, school, health, safety, games and social media are fine. If unsure, answer false. Reply ONLY with JSON like {\"block\":false}.\n"+kind+": "+text,{modelTier:"quick"});
    bad=!!(r&&r.block===true);
  }catch(e){}
  verdicts.set(key,bad);return bad;
}
async function vetSite(u,id){
  const h=hostOf(u);let bad=false;
  try{const s=window.claude?await window.claude.use("sample"):null;if(s)bad=await unsafe(s,"web address",h)}catch(e){}
  siteBad.set(h,bad);
  const tt=tabs.find(x=>x.id===id);
  if(tt&&tt.hist[tt.i]===u) render();
}
function ytEmbed(u){
  try{
    if(isBlocked(u)) return u;
    const x=new URL(u),h=x.hostname.toLowerCase().replace(/^(www|m)\./,"");
    let id=null;
    if(h==="discord.com"){
      const m=x.pathname.match(/^\/channels\/(\d+)\/(\d+)/);
      if(m) return "https://e.widgetbot.io/channels/"+m[1]+"/"+m[2];
      if(["/","/app","/login"].includes(x.pathname)||x.pathname.startsWith("/channels")) return "comland://discord";
    }
    if(h==="youtu.be") id=x.pathname.slice(1).split("/")[0];
    else if(h==="youtube.com"){
      if(x.pathname==="/watch") id=x.searchParams.get("v");
      else if(x.pathname.startsWith("/live/")) id=x.pathname.split("/")[2];
      else if(x.pathname==="/playlist"&&x.searchParams.get("list")) return "https://www.youtube-nocookie.com/embed/videoseries?list="+encodeURIComponent(x.searchParams.get("list"));
      else if(x.pathname==="/") return "comland://youtube";
    }
    if(id&&/^[\w-]{6,15}$/.test(id)){const s=parseInt(x.searchParams.get("t")||"",10);return "https://www.youtube-nocookie.com/embed/"+id+(s>0?"?start="+s:"")}
  }catch(e){}
  return u;
}
function wire(v){
  const df=v.querySelector("#df");if(df)df.onsubmit=e=>{e.preventDefault();const s=v.querySelector("#dsv").value.trim(),c=v.querySelector("#dch").value.trim(),m=v.querySelector("#dmsg");if(!/^\d{15,22}$/.test(s)||!/^\d{15,22}$/.test(c)){m.textContent="Server ID and channel ID are long numbers. Copy them from Discord with Developer Mode on.";return}try{localStorage.setItem("comland-discord",JSON.stringify({s,c}))}catch(x){}go("https://e.widgetbot.io/channels/"+s+"/"+c)};
  const yf=v.querySelector("#yf");if(yf)yf.onsubmit=e=>{e.preventDefault();go(v.querySelector("#yq").value)};
  v.querySelectorAll("[data-phone]").forEach(b=>b.onclick=()=>go(PHONE_URL));
  v.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>go(b.dataset.u));
  v.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>go(SITES[b.dataset.s][2]));
  v.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{marks.splice(+b.dataset.r,1);saveMarks();render()});
  const f=v.querySelector("#sf"); if(f) f.onsubmit=e=>{e.preventDefault();go(v.querySelector("#sq").value)};
}
function render(){
  const t=tab(),v=$("view");
  if(isCallTarget(t.hist[t.i])){t.hist=[PHONE_URL];t.i=0}
  const u=t.hist[t.i];
  renderTabs(); renderMarks();
  $("url").value=u.startsWith("comland://home")?"":u;
  const marked=marks.some(m=>m.url===u); $("star").textContent=marked?"★":"☆";
  $("ext").disabled=u.startsWith("comland://")||isBlocked(u);
  v.innerHTML="";
  if(u.startsWith("comland://search")&&blockedSearch(u)){v.appendChild(blockedPage("This topic is Blocked by the Colandian Government"))}
  else if(u.startsWith("comland://")){const p=internal(u);v.appendChild(p);wire(p);if(u.startsWith("comland://search"))runSearch(p,u)}
  else if(isBlocked(u)){v.appendChild(blockedPage())}
  else if(siteBad.get(hostOf(u))===true){v.appendChild(blockedPage())}
  else if(!safeHost(u)&&!siteBad.has(hostOf(u))){v.appendChild(page("<h2>Checking this site…</h2><p class='muted'>The Colandian filter is making sure it’s safe.</p>"));vetSite(u,t.id)}
  else{
    const f=document.createElement("iframe"); f.src=u; f.title=titleOf(u);
    f.setAttribute("referrerpolicy",u.includes("youtube-nocookie.com")?"strict-origin-when-cross-origin":"no-referrer"); f.allowFullscreen=true; f.setAttribute("allow","fullscreen; picture-in-picture; autoplay; encrypted-media"); f.setAttribute("sandbox","allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox");
    v.appendChild(f);
    const n=document.createElement("div"); n.className="note";
    n.innerHTML=`<span>Blank or refused? This site may block embedding.</span><span><a target="_blank" rel="noopener noreferrer" href="${esc(u)}">Open in a real tab ↗</a> <button id="nx">Dismiss</button></span>`;
    v.appendChild(n); n.querySelector("#nx").onclick=()=>n.remove();
  }
}
$("url").addEventListener("keydown",e=>{if(e.key==="Enter"){go(e.target.value);e.target.blur()}});
$("url").addEventListener("focus",e=>e.target.select());
$("reload").onclick=render;
$("home").onclick=()=>go("comland://home");
$("star").onclick=()=>{
  const u=tab().hist[tab().i],k=marks.findIndex(m=>m.url===u);
  if(k>=0) marks.splice(k,1); else marks.push({url:u,title:titleOf(u)});
  saveMarks(); render();
};
$("ext").onclick=()=>{const u=tab().hist[tab().i];if(!u.startsWith("comland://")&&!isBlocked(u))window.open(u,"_blank","noopener,noreferrer")};
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==="l"){e.preventDefault();$("url").focus()}
});
newTab();
</script>
